<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>EnduroGT | telemetry</title>
        <link href="css/style.css" rel="stylesheet">
        <script src="js/darkmode.js" defer></script>

        <script src="js/app.js" defer></script>
        
  </head>
    <body>
        <fieldset>
            <legend>EnduroGT Telemetry</legend>
            <div class="dashboard">
                <fieldset class="weather"><legend>Weather</legend>Not Available</fieldset>
                <fieldset class="speed"><legend>Speed</legend>

                    <h1><span id="speed">0</span> kmph</h1>
                </fieldset>
                <fieldset class="distance"><legend>Distance</legend>0.0 km</fieldset>
                <fieldset class="crew"><legend>Crew Ranking</legend><ul>
                        <li>#1 - kozue [80kmph]</li>
                        <li>#2 - kaito [50kmph]</li>
                        <li>#3 - N/A</li>
                    </ul></fieldset>
                    <fieldset class="vehicle"><legend>Ride</legend>Honda Dio</fieldset>
                    <fieldset class="time"><legend>Time</legend><span id="session-time">00:00:00</span></fieldset>
                    <fieldset class="top-speed"><legend>Top Speed</legend>
                        <span id="topSpeed">0</span> km/h
                    </fieldset>
            </div>
        </fieldset>
        <button onclick="toggleDarkMode()"></button>

         <script>
            let topSpeed = 0; // Track the highest speed

            function toKmH(speed) {
                return (speed * 3.6).toFixed(0); // Convert m/s to km/h
            }

            function updateSpeed(position) {
                let speed = position.coords.speed; // Speed in m/s
                if (speed !== null) {
                    let speedKmH = toKmH(speed);
                    document.getElementById("speed").textContent = speedKmH;
                    console.log(`Current Speed: ${speedKmH} km/h`);

                    // Update top speed if it's higher
                    if (speed > topSpeed) {
                        topSpeed = speed;
                        document.getElementById("topSpeed").textContent = toKmH(topSpeed);
                    }
                }
            }

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(updateSpeed, console.error, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 1000
                });
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        </script>
    </body>
</html>
