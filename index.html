<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Speed</title>
</head>
<body>
    <h1>Speed: <span id="speed">0</span> km/h</h1>

    <script>
        function toKmH(speed) {
            return (speed * 3.6).toFixed(2); // Convert m/s to km/h
        }

        function updateSpeed(position) {
            let speed = position.coords.speed; // Speed in m/s
	    console.log(toKmH(speed));
            if (speed !== null) {
                document.getElementById("speed").textContent = toKmH(speed);
            }
        }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(updateSpeed, console.error, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    </script>
</body>
</html>
